# Matches the style the config is actually written in (stylua defaults except 2-space indent).
# A copy lives at the chezmoi repo root so format-on-save behaves the same when editing the source tree.
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
