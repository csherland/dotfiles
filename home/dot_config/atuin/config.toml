# Atuin - shell history

## Search UX
style = "compact"
inline_height = 20
show_preview = true
show_help = false
show_tabs = false
time_format = ""

## Search behavior
search_mode = "fuzzy"

## Privacy
history_filter = [
  "^export.*TOKEN",
  "^export.*SECRET",
  "^export.*KEY",
  "^export.*PASSWORD",
]

## Quality of life
update_check = false
enter_accept = true
keymap_mode = "vim-normal"

## Disable sync
sync_frequency = "0"

## Theme file lives in ~/.config/atuin/themes/
## Render the search in a tmux popup (same size as the fzf-tab popup).
## Falls back to the inline UI outside tmux.
[tmux]
enabled = true
width = "90"
height = "20"

[ui]
## Drop the duration column; time + command is enough
columns = ["time", "command"]

[theme]
name = "catppuccin-mocha"
