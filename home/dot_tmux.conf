# ==========================
# ===  General settings  ===
# ==========================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g buffer-limit 20

# Change prefix key to C-Space
unbind C-b
set -g prefix C-Space

# Set parent terminal title to reflect current window in tmux session
set -g set-titles on
set -g set-titles-string "#I:#W"

# Start index of window/pane with 1, because we're humans, not computers
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

set -g detach-on-destroy off     # don't exit tmux when closing a session
set -g escape-time 0             # no delay after escape (for nvim)
set -g focus-events on           # nvim autoread and focus detection
set -g history-limit 1000000     # increase scrollback (default 2000)
set -g renumber-windows on       # renumber windows when any is closed
set -g set-clipboard on          # system clipboard integration
set -g allow-passthrough on      # let OSC sequences reach outer terminal (notifications over SSH)
setw -g mode-keys vi             # vim-style copy mode

# Window names: use the pane title when a program has set one (Claude Code, Codex, and
# other agents set a task summary), otherwise the running command. Plain shells and nvim
# leave the title at the hostname, so that is the "unset" check.
set -g automatic-rename-format \
  '#{?pane_in_mode,[tmux],#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}}}#{?pane_dead,[dead],}'

# Session names: name unnamed (numeric) sessions after the directory they start in
# (single quotes matter: the session id looks like $12, which sh would otherwise expand)
set-hook -g session-created "run-shell \"~/.tmux/name_session.sh '#{hook_session}'\""
set -g status-keys emacs         # emacs keys in the command prompt (prefix + :)
setw -g aggressive-resize on     # size window to the smallest client actually viewing it

# ==========================
# ===   Key bindings     ===
# ==========================

# Key palette: fuzzy-search bindings and run one (replaces the default list-keys pager)
bind -N "Key palette" ? display-popup -E -w 64 -h 60% -T " keys " "~/.tmux/keys.sh '#{client_name}'"

# Reload tmux configuration
bind -N "Reload tmux config" r source-file ~/.tmux.conf \; display "Config reloaded"

# New window retaining cwd
bind -N "New window (same directory)" c new-window -c "#{pane_current_path}"

# Rename current window / session in a centered popup (easier to see than the status line)
bind -N "Rename window" R display-popup -E -w 50 -h 3 -T " rename window " "~/.tmux/rename.sh window '#W'"
bind -N "Rename session" S display-popup -E -w 50 -h 3 -T " rename session " "~/.tmux/rename.sh session '#S'"

# Intuitive split panes (| = vertical divider, - = horizontal divider), retain cwd
bind -N "Split pane left/right" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane top/bottom" - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation (prefix-less C-h/j/k/l comes from vim-tmux-navigator)
bind -N "Select pane left" h select-pane -L
bind -N "Select pane below" j select-pane -D
bind -N "Select pane above" k select-pane -U
bind -N "Select pane right" l select-pane -R
bind -N "Clear screen" C-l send-keys 'C-l'         # clear screen, since C-l alone now moves right

# Vim-style pane resizing
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

# Session picker: live sessions, zoxide dirs, and configs in a popup (sesh)
bind -N "Session picker (sesh)" o run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '  ' \
    --header '  ^a all ^t tmux ^x zoxide ^f find ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-x:change-prompt(  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Copy mode (vim-style)
bind -N "Enter copy mode" v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection

# =====================================
# ===    Appearence and status bar  ===
# ======================================

# general status bar settings
set -g status on
set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status 2                  # second line is a thin rule under the tab bar (see below)

# =====================================
# ===        Renew environment      ===
# =====================================
set -g update-environment \
  "DISPLAY\
  SSH_ASKPASS\
  SSH_AUTH_SOCK\
  SSH_AGENT_PID\
  SSH_CONNECTION\
  SSH_TTY\
  WINDOWID\
  XAUTHORITY"

bind -N "Renew environment in shells" '$' run "~/.tmux/renew_env.sh"

# ============================
# ===       Plugins        ===
# ============================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'accessd/tmux-agent-indicator'

# Session restore
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# fingers: prefix + Space shows hints over paths/URLs/hashes; press one to copy it,
# Tab to multi-select, Shift+hint to paste it into the pane. Binary comes from brew (tmux-fingers).
set -g @fingers-key Space
set -g @fingers-jump-key M-j                       # default J collides with resize-pane
set -g @fingers-use-system-clipboard 1

# vim-tmux-navigator would rebind prefix + C-l itself; keep our noted binding instead
set -g @vim_navigator_prefix_mapping_clear_screen ''

# agent-indicator: Claude/Codex hooks colour a window's tab and pane border by state.
# Colours are catppuccin mocha hex values (the plugin runs before @thm_* would be usable here).
set -g @agent-indicator-background-enabled 'off'   # never tint the whole pane
set -g @agent-indicator-limits-enabled 'off'
set -g @agent-indicator-needs-input-border '#f9e2af'
set -g @agent-indicator-needs-input-window-title-bg '#f9e2af'
set -g @agent-indicator-needs-input-window-title-fg '#11111b'
set -g @agent-indicator-done-border '#a6e3a1'
set -g @agent-indicator-done-window-title-bg '#a6e3a1'
set -g @agent-indicator-done-window-title-fg '#11111b'

# fzf-url
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Theme: catppuccin is used for its palette (@thm_*), pane borders and popups only.
# Window tabs and status modules are hand-written below for a flat, text-only look.
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_status_background "none"

# Run all plugins' scripts (before status bar so catppuccin variables are available)
run '~/.tmux/plugins/tpm/tpm'

# Status bar (set with -F so @thm_* colors expand now; ## defers tmux formats to render time)
#   [ session ]  1 nvim  2 zsh  3 claude                                   ~/dir
set -gF status-left "#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] ##S #[default] "
# right: current directory, but only when it differs from the session name
set -gF status-right "#[fg=#{@thm_overlay_1}]##{?##{==:##{b:pane_current_path},##S},,##{b:pane_current_path} }"

# Base styles carry the text colour so agent-indicator can override a whole tab;
# the formats only colour the window number and return to base with #[default].
set -gF window-status-style "fg=#{@thm_overlay_1}"
set -gF window-status-current-style "fg=#{@thm_fg}"
set -gF window-status-format \
  " #[fg=#{@thm_overlay_1}]##I #[default]##{?window_bell_flag,#[fg=#{@thm_yellow}],}##W "
set -gF window-status-current-format \
  " #[fg=#{@thm_mauve},bold]##I #[default]##W##{?window_zoomed_flag,#[fg=#{@thm_peach}] 󰁌,} "
set -gF window-status-separator "#[fg=#{@thm_surface_1}]│"

# Rule under the tab bar. tmux cannot repeat a character to the client width, so this is
# a long fixed string that tmux truncates to fit.
set -gF status-format[1] "#[fg=#{@thm_surface_1},bg=default]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"
set -gF window-status-bell-style "none"
set -gF window-status-activity-style "none"
