# ==========================
# ===  General settings  ===
# ==========================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# Let tmux tell modified keys apart (Shift+Enter vs Enter) and pass them through
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g buffer-limit 20

# Change prefix key to C-Space
unbind C-b
set -g prefix C-Space

# Set parent terminal title to reflect current window in tmux session
set -g set-titles on
set -g set-titles-string "#I:#W"

# Start index of window/pane with 1, because we're humans, not computers
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

set -g detach-on-destroy off     # don't exit tmux when closing a session
set -g escape-time 0             # no delay after escape (for nvim)
set -g focus-events on           # nvim autoread and focus detection
set -g history-limit 50000       # scrollback per pane (default 2000; resurrect saves this)
set -g renumber-windows on       # renumber windows when any is closed
set -g set-clipboard on          # system clipboard integration
set -g allow-passthrough all     # forward OSC sequences (desktop notifications) even from windows that are not visible
setw -g mode-keys vi             # vim-style copy mode

# Window names: use the pane title when a program has set one (Claude Code, Codex, and
# other agents set a task summary), otherwise the running command. A title counts as
# "unset" when it is empty or still the hostname: tmux seeds a new pane's title with the
# hostname, and agents clear the title to empty when they exit (a shell never sets it back,
# so without the empty case an exited agent leaves the tab blank).
# The fallback is "command - directory", because a screenful of windows all named "zsh" says
# nothing. Claude installs itself as a version-named binary, so a purely numeric command
# (2.1.270) is rewritten to "claude".
set -g automatic-rename-format \
  '#{?pane_in_mode,[tmux],#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host}}},#{pane_title},#{s|^[0-9][0-9.]*$|claude|:pane_current_command} - #{b:pane_current_path}}}#{?pane_dead,[dead],}'

# Session names: name unnamed (numeric) sessions after the directory they start in
# (single quotes matter: the session id looks like $12, which sh would otherwise expand)
set-hook -g session-created "run-shell \"~/.tmux/name_session.sh '#{hook_session}'\""
# Pane labels: show a label strip only in windows that are split (see pane-border-format
# below). The hook also freezes the window name while split, so navigating between panes
# does not keep renaming the tab.
set-hook -g window-layout-changed "run-shell \"~/.tmux/pane_borders.sh '#{hook_window}'\""

# agent_attention.sh records per-window agent state in @agent_attention. The tab itself is
# coloured by tmux-agent-indicator, so the state is not drawn here; the option feeds the
# "N waiting" counter in the status bar. Clear it as soon as you look at the window (index 9 keeps this
# separate from the hooks tmux-agent-indicator registers, and stops it stacking on reload)
set-hook -g 'after-select-window[9]' "run-shell \"~/.tmux/agent_attention.sh clear '#{window_id}'\""

set -g status-keys emacs         # emacs keys in the command prompt (prefix + :)
setw -g aggressive-resize on     # size window to the smallest client actually viewing it

# ==========================
# ===   Key bindings     ===
# ==========================

# Key palette: fuzzy-search bindings and run one (replaces the default list-keys pager)
bind -N "Key palette" ? display-popup -E -w 64 -h 60% -T " keys " "~/.tmux/keys.sh"

# Reload tmux configuration
bind -N "Reload tmux config" r source-file ~/.tmux.conf \; display "Config reloaded"

# New window retaining cwd
bind -N "New window (same directory)" c new-window -c "#{pane_current_path}"

# Rename current window / session in a centered popup (easier to see than the status line)
bind -N "Rename window" R display-popup -E -w 50 -h 3 -T " rename window " "~/.tmux/rename.sh window"
bind -N "Rename session" S display-popup -E -w 50 -h 3 -T " rename session " "~/.tmux/rename.sh session"

# Intuitive split panes (| = vertical divider, - = horizontal divider), retain cwd
bind -N "Split pane left/right" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane top/bottom" - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation (prefix-less C-h/j/k/l comes from vim-tmux-navigator)
bind -N "Select pane left" h select-pane -L
bind -N "Select pane below" j select-pane -D
bind -N "Select pane above" k select-pane -U
bind -N "Select pane right" l select-pane -R
bind -N "Clear screen" C-l send-keys 'C-l'         # clear screen, since C-l alone now moves right

# Vim-style pane resizing
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

# Session picker: live sessions, zoxide dirs, and configs in a popup (sesh)
bind -N "Session picker (sesh)" o run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '  ' \
    --header '  ^a all ^t tmux ^x zoxide ^f find ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-x:change-prompt(  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Floating popups over the current pane, opened in its directory
bind -N "Scratch shell (popup)" t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind -N "Lazygit (popup)" g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Copy mode (vim-style)
bind -N "Enter copy mode" v copy-mode
bind -N "Search scrollback" / display-popup -E -w 80% -h 70% -T " search " "~/.tmux/search.sh"
bind -N "Search scrollback (plain)" C-/ copy-mode \; send-keys -X search-backward-incremental
bind-key -T copy-mode-vi v send-keys -X begin-selection

# =====================================
# ===    Appearence and status bar  ===
# ======================================

# general status bar settings
set -g status on
set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 200
set -g status 2                  # second line is a thin rule under the tab bar (see below)
set -g message-line 1            # show messages on the rule line, not over the tabs
set -g display-time 3000         # keep messages up long enough to read (default 750ms)

# =====================================
# ===        Renew environment      ===
# =====================================
set -g update-environment \
  "DISPLAY\
  SSH_ASKPASS\
  SSH_AUTH_SOCK\
  SSH_AGENT_PID\
  SSH_CONNECTION\
  SSH_TTY\
  WINDOWID\
  XAUTHORITY"

bind -N "Renew environment in shells" '$' run "~/.tmux/renew_env.sh"

# ============================
# ===       Plugins        ===
# ============================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'accessd/tmux-agent-indicator'

# Session restore
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'   # restore each pane's visible scrollback too
# Relaunch agent panes too (this list is added to resurrect's defaults, it does not replace
# them). A bare `claude` would come back as a brand new conversation, so the `->` inline
# strategy restores it as `claude --continue`, which resumes the last conversation in that
# pane's directory.
set -g @resurrect-processes '"~claude->claude --continue"'

# agent-indicator: Claude/Codex hooks colour a window's tab and pane border by state.
# Colours are catppuccin mocha hex values (the plugin runs before @thm_* would be usable here).
set -g @agent-indicator-background-enabled 'off'   # never tint the whole pane
set -g @agent-indicator-limits-enabled 'off'
set -g @agent-indicator-needs-input-border '#f9e2af'
set -g @agent-indicator-needs-input-window-title-bg '#f9e2af'
set -g @agent-indicator-needs-input-window-title-fg '#11111b'
set -g @agent-indicator-done-border '#a6e3a1'
set -g @agent-indicator-done-window-title-bg '#a6e3a1'
set -g @agent-indicator-done-window-title-fg '#11111b'
# No notification-command: Claude Code sends its own desktop notification through Ghostty.
set -g @agent-indicator-notification-format '#{agent_name} #{agent_state} · #{window_name}  '

# fzf-url
# prefix + Space: URLs from the pane and scrollback in a popup. Enter opens, Ctrl-y copies, Tab multi-selects.
set -g @fzf-url-bind 'Space'
set -g @fzf-url-history-limit '2000'
set -g @fzf-url-fzf-options "-p 70%,50% --multi --exit-0 --reverse --no-info --prompt '  ' --border-label ' urls ' --header 'Enter opens · Ctrl-y copies · Tab selects' --color 'header:dim'"

# Theme: catppuccin is used for its palette (@thm_*), pane borders and popups only.
# Window tabs and status modules are hand-written below for a flat, text-only look.
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_status_background "none"

# Run all plugins' scripts (before status bar so catppuccin variables are available)
run '~/.tmux/plugins/tpm/tpm'

# Popups sit on a solid background so the pane behind them never shows through.
set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# Status bar (set with -F so @thm_* colors expand now; ## defers tmux formats to render time)
#   [ session ]  1 nvim  2 zsh  3 claude                                   ~/dir
set -gF status-left "#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] ##S #[default] "
# Right side, all of it conditional so the bar stays empty when there is nothing to say:
#   prefix pending · copy mode · agents wanting attention · current directory
set -gF status-right "##{?client_prefix,#[fg=#{@thm_crust}]#[bg=#{@thm_mauve}]#[bold] PREFIX #[default]  ,}"
set -agF status-right "##{?pane_in_mode,#[fg=#{@thm_crust}]#[bg=#{@thm_teal}]#[bold] COPY #[default]  ,}"
# ##( so -F leaves the shell call for render time; the colour arguments expand now
set -agF status-right "##(~/.tmux/agent_summary.sh '#{@thm_yellow}' '#{@thm_green}')"
set -agF status-right "#[fg=#{@thm_overlay_1}]##{?##{==:##{b:pane_current_path},##S},,##{b:pane_current_path} }"

# Base styles carry the text colour so agent-indicator can override a whole tab;
# the formats only colour the window number and return to base with #[default].
set -gF window-status-style "fg=#{@thm_overlay_1}"
set -gF window-status-current-style "fg=#{@thm_fg}"
set -gF window-status-format \
  " #[fg=#{@thm_overlay_1}]##I #[default]##{?window_bell_flag,#[fg=#{@thm_yellow}],}##{=/25/…:window_name} "
set -gF window-status-current-format \
  " #[fg=#{@thm_mauve},bold]##I #[default]##{=/25/…:window_name}##{?window_zoomed_flag,#[fg=#{@thm_peach}] 󰁌,} "
set -gF window-status-separator "#[fg=#{@thm_surface_1}]│"

# Pane labels (only drawn in split windows; the hook above toggles them on and off).
# Same naming rule as windows: a program's own title if it set one, else the command.
# One place to change the active-pane accent: it colours both the label block and the
# active pane's top border line, so the two read as a single bar across the top of the pane.
set -gF @pane_accent "#{@thm_teal}"

# Border lines stay dim on every edge; the label block alone marks the active pane.
set -g pane-border-lines single
set -gF pane-border-style "fg=#{@thm_surface_0}"
set -gF pane-active-border-style "fg=#{@thm_surface_0}"

# The active pane's label is a filled accent block; inactive labels are plain dim text.
# Sapphire rather than mauve so a pane label never reads as the session badge, and clear of
# the yellow/green the agent states use.
# (No commas inside a #{?} branch: tmux splits branches on commas, so styles are written
# as separate #[..] directives rather than one comma-separated list.)
set -gF pane-border-format \
  "##{?pane_active,#[fg=#{@thm_crust}]#[bg=#{@pane_accent}]#[bold],#[fg=#{@thm_overlay_1}]}##P ##{?##{&&:##{pane_title},##{!=:##{pane_title},##{host}}},##{pane_title},##{pane_current_command}} #[default]"

# Messages, prompts and plugin notices all read as one centred dialog on the rule line:
# high contrast so they cannot be missed, centred so they are not lost against either edge.
# (They cannot sit at the bottom of the screen: tmux only draws messages on a status line,
# and the status bar is at the top.)
set -gF message-style "fg=#{@thm_crust},bg=#{@thm_peach},bold,align=centre"
set -gF message-command-style "fg=#{@thm_crust},bg=#{@thm_peach},bold,align=centre"

# Rule under the tab bar. tmux cannot repeat a character to the client width, so this is
# a long fixed string that tmux truncates to fit.
set -gF status-format[1] "#[fg=#{@thm_surface_1},bg=default]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"
set -gF window-status-bell-style "none"
set -gF window-status-activity-style "none"
